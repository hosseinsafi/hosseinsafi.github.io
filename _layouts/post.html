---
layout: default
---
<article class="post">
  <p class="post-date">{{ page.date | date: "%-d %B %Y" }}{% if page.type %} · {{ page.type }}{% endif %}</p>
  <h1>{{ page.title }}</h1>

  <div class="post-body">
    {{ content }}
  </div>

  {% if page.link %}
  <p class="post-link"><a href="{{ page.link }}" target="_blank" rel="noopener">{{ page.link }}</a></p>
  {% endif %}

  <p class="post-back"><a href="{{ '/updates/' | relative_url }}">All updates</a></p>
</article>
